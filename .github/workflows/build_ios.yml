name: Build AeroPoint Spatial iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ipa:
    name: 🍏 Compile & Package iOS IPA
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 📦 Install XcodeGen
        run: brew install xcodegen

      - name: ⚙️ Generate Xcode Project
        run: |
          cd ios/AeroPointSpatial
          xcodegen generate

      - name: 🚀 Build Release Archive (Ad-Hoc / Sideloadable)
        run: |
          cd ios/AeroPointSpatial
          xcodebuild -project AeroPointSpatial.xcodeproj \
                     -scheme AeroPointSpatial \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     build

      - name: 📦 Package into .IPA Archive
        run: |
          cd ios/AeroPointSpatial
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AeroPointSpatial.app Payload/
          zip -r AeroPointSpatial.ipa Payload
          ls -lh AeroPointSpatial.ipa

      - name: 📤 Upload AeroPointSpatial.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroPointSpatial-iOS-IPA
          path: ios/AeroPointSpatial/AeroPointSpatial.ipa
          retention-days: 14
