name: Build AeroPoint Spatial iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'ios/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ipa:
    name: 🍏 Compile & Package iOS IPA
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: 📦 Install XcodeGen
        run: brew install xcodegen

      - name: ⚙️ Generate Xcode Project
        run: |
          cd ios/AeroPointSpatial
          xcodegen generate
          # Ensure project format compatibility across Xcode 15 & 16
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' AeroPointSpatial.xcodeproj/project.pbxproj 2>/dev/null || sed -i 's/objectVersion = [0-9]*/objectVersion = 56/g' AeroPointSpatial.xcodeproj/project.pbxproj

      - name: 🚀 Build Release Archive (Ad-Hoc / Sideloadable)
        run: |
          cd ios/AeroPointSpatial
          xcodebuild -project AeroPointSpatial.xcodeproj \
                     -scheme AeroPointSpatial \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     build

      - name: 📦 Package into .IPA Archive
        run: |
          cd ios/AeroPointSpatial
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r AeroPointSpatial.ipa Payload
          ls -lh AeroPointSpatial.ipa

      - name: 📤 Upload AeroPointSpatial.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroPointSpatial-iOS-IPA
          path: ios/AeroPointSpatial/AeroPointSpatial.ipa
          retention-days: 14

      - name: 🏷️ Publish GitHub Release with Sideloadable IPA
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/AeroPointSpatial/AeroPointSpatial.ipa
          tag_name: ${{ github.ref_name }}
          name: "AeroPoint Spatial iOS ${{ github.ref_name }}"
          body: |
            ### 🍏 AeroPoint Spatial iOS Client (${{ github.ref_name }})
            - **Direct Download**: Download `AeroPointSpatial.ipa` below.
            - **Installation**: Sideload via [AltStore](https://altstore.io), [SideStore](https://sidestore.io), [TrollStore](https://github.com/opa334/TrollStore), or [Scarlet](https://usescarlet.com).
            - **LiDAR & TrueDepth Support**: Real-time 60 FPS spatial hand tracking over UDP/HTTP LAN with zero config.
          draft: false
          prerelease: false
